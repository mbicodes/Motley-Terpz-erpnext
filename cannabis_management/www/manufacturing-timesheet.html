<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Manufacturing Timesheet Kiosk</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

		html, body {
			height: 100%;
			background: radial-gradient(circle at top, #2b3a55 0%, #10141f 70%);
			color: #eef1f7;
		}

		body {
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.card {
			width: 380px;
			max-width: 100%;
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 255, 255, 0.12);
			backdrop-filter: blur(10px);
			border-radius: 18px;
			padding: 40px 32px 28px;
			text-align: center;
			box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
		}

		.icon-badge {
			width: 62px;
			height: 62px;
			margin: 0 auto 18px;
			border-radius: 50%;
			background: linear-gradient(145deg, #4a63ff, #2c3ea8);
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 8px 20px rgba(74, 99, 255, 0.45);
		}

		.icon-badge svg { width: 28px; height: 28px; fill: #fff; }

		.card h1 {
			font-size: 19px;
			font-weight: 600;
			margin-bottom: 4px;
			letter-spacing: .2px;
		}

		.card .subtitle {
			font-size: 12.5px;
			color: #aab3c8;
			margin-bottom: 26px;
		}

		.field { text-align: left; margin-bottom: 16px; }

		.field label {
			display: block;
			font-size: 11.5px;
			text-transform: uppercase;
			letter-spacing: .06em;
			color: #9aa4bd;
			margin-bottom: 6px;
		}

		.field input, .field select {
			width: 100%;
			padding: 12px 14px;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			background: rgba(255, 255, 255, 0.07);
			color: #fff;
			font-size: 15px;
			outline: none;
			transition: border-color .15s ease, background .15s ease;
		}

		.field input::placeholder { color: #6f7891; letter-spacing: 3px; }

		.field input:focus, .field select:focus {
			border-color: #4a63ff;
			background: rgba(255, 255, 255, 0.1);
		}

		.field input[readonly] { color: #c7cde0; background: rgba(255,255,255,0.04); }

		select option { color: #111; }

		.btn {
			width: 100%;
			padding: 13px;
			border: none;
			border-radius: 10px;
			background: linear-gradient(145deg, #4a63ff, #2c3ea8);
			color: #fff;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			letter-spacing: .3px;
			transition: filter .15s ease, transform .05s ease;
		}

		.btn:hover { filter: brightness(1.08); }
		.btn:active { transform: scale(.99); }
		.btn:disabled { opacity: .6; cursor: not-allowed; }

		.btn.secondary {
			background: rgba(255,255,255,0.08);
			margin-top: 10px;
			font-weight: 500;
		}

		.error-msg {
			min-height: 18px;
			color: #ff8b8b;
			font-size: 12.5px;
			margin: -6px 0 14px;
		}

		.summary-box {
			background: rgba(255,255,255,0.05);
			border: 1px solid rgba(255,255,255,0.1);
			border-radius: 10px;
			padding: 14px 16px;
			text-align: left;
			margin-bottom: 18px;
		}

		.summary-box .row {
			display: flex;
			justify-content: space-between;
			font-size: 13.5px;
			padding: 4px 0;
		}

		.summary-box .row span:first-child { color: #9aa4bd; }

		.employee-banner {
			font-size: 13.5px;
			color: #c7cde0;
			margin-bottom: 20px;
			padding-bottom: 16px;
			border-bottom: 1px dashed rgba(255,255,255,0.15);
		}

		.employee-banner b { color: #fff; }

		.footer-note {
			margin-top: 22px;
			font-size: 11.5px;
			color: #6f7891;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
		}

		.footer-note svg { width: 12px; height: 12px; fill: #6f7891; }

		.status-msg {
			font-size: 14px;
			color: #8fe3a3;
			margin-bottom: 8px;
		}

		.shake { animation: shake .35s; }
		@keyframes shake {
			10%, 90% { transform: translateX(-1px); }
			20%, 80% { transform: translateX(2px); }
			30%, 50%, 70% { transform: translateX(-4px); }
			40%, 60% { transform: translateX(4px); }
		}

		[hidden] { display: none !important; }
	</style>
</head>
<body>

	<div class="card" id="kiosk-card">

		<!-- LOCK SCREEN -->
		<section id="screen-lock">
			<div class="icon-badge">
				<svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3zm3 5a2 2 0 0 1 1 3.73V19a1 1 0 1 1-2 0v-1.27A2 2 0 0 1 12 14z"/></svg>
			</div>
			<h1>Manufacturing Timesheet</h1>
			<p class="subtitle">Enter your personal access code to clock in or out</p>

			<form id="lock-form" autocomplete="off">
				<div class="field">
					<label for="access-code">Access code</label>
					<input type="password" id="access-code" placeholder="••••••" inputmode="numeric" autofocus required>
				</div>
				<div class="error-msg" id="lock-error"></div>
				<button type="submit" class="btn" id="unlock-btn">Unlock</button>
			</form>

			<div class="footer-note">
				<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
				Every attempt is recorded.
			</div>
		</section>

		<!-- START SCREEN -->
		<section id="screen-start" hidden>
			<div class="icon-badge">
				<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
			</div>
			<h1>Start Timesheet</h1>
			<p class="employee-banner">Welcome, <b id="start-employee-name">-</b></p>

			<div class="field">
				<label for="start-activity-type">Activity Type</label>
				<select id="start-activity-type" required></select>
			</div>
			<div class="field">
				<label for="start-time">Start Time</label>
				<input type="datetime-local" id="start-time" required>
			</div>
			<div class="error-msg" id="start-error"></div>
			<button type="button" class="btn" id="start-save-btn">Save &amp; Start</button>
			<button type="button" class="btn secondary" id="start-cancel-btn">Cancel</button>
		</section>

		<!-- END SCREEN -->
		<section id="screen-end" hidden>
			<div class="icon-badge">
				<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
			</div>
			<h1>End Timesheet</h1>
			<p class="employee-banner">Welcome back, <b id="end-employee-name">-</b></p>

			<div class="summary-box">
				<div class="row"><span>Activity Type</span><span id="end-activity-type">-</span></div>
				<div class="row"><span>Start Time</span><span id="end-start-time">-</span></div>
			</div>

			<div class="field">
				<label for="end-time">End Time</label>
				<input type="datetime-local" id="end-time" required>
			</div>
			<div class="error-msg" id="end-error"></div>
			<button type="button" class="btn" id="end-save-btn">Save &amp; End</button>
			<button type="button" class="btn secondary" id="end-cancel-btn">Cancel</button>
		</section>

		<!-- DONE SCREEN -->
		<section id="screen-done" hidden>
			<div class="icon-badge">
				<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
			</div>
			<h1 id="done-title">All set</h1>
			<p class="status-msg" id="done-message"></p>
			<p class="subtitle">Returning to the access screen…</p>
		</section>

	</div>

	<script>
	(function () {
		"use strict";

		var API = "/api/method/cannabis_management.manufacturing_timesheet_kiosk.api.";
		var state = { token: null };

		var els = {
			card: document.getElementById("kiosk-card"),
			screens: {
				lock: document.getElementById("screen-lock"),
				start: document.getElementById("screen-start"),
				end: document.getElementById("screen-end"),
				done: document.getElementById("screen-done"),
			},
			lockForm: document.getElementById("lock-form"),
			accessCode: document.getElementById("access-code"),
			lockError: document.getElementById("lock-error"),
			unlockBtn: document.getElementById("unlock-btn"),

			startEmployeeName: document.getElementById("start-employee-name"),
			startActivityType: document.getElementById("start-activity-type"),
			startTime: document.getElementById("start-time"),
			startError: document.getElementById("start-error"),
			startSaveBtn: document.getElementById("start-save-btn"),
			startCancelBtn: document.getElementById("start-cancel-btn"),

			endEmployeeName: document.getElementById("end-employee-name"),
			endActivityType: document.getElementById("end-activity-type"),
			endStartTime: document.getElementById("end-start-time"),
			endTime: document.getElementById("end-time"),
			endError: document.getElementById("end-error"),
			endSaveBtn: document.getElementById("end-save-btn"),
			endCancelBtn: document.getElementById("end-cancel-btn"),

			doneTitle: document.getElementById("done-title"),
			doneMessage: document.getElementById("done-message"),
		};

		function showScreen(name) {
			Object.keys(els.screens).forEach(function (key) {
				els.screens[key].hidden = key !== name;
			});
		}

		function toLocalInputValue(date) {
			var d = date ? new Date(date) : new Date();
			var pad = function (n) { return String(n).padStart(2, "0"); };
			return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
				"T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
		}

		function formatDisplay(date) {
			var d = new Date(date);
			return d.toLocaleString();
		}

		function resetToLock() {
			state.token = null;
			els.accessCode.value = "";
			els.lockError.textContent = "";
			els.startError.textContent = "";
			els.endError.textContent = "";
			showScreen("lock");
			els.accessCode.focus();
		}

		function call(method, args) {
			return fetch(API + method, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-Frappe-CSRF-Token": (window.frappe && frappe.csrf_token) || "",
				},
				body: JSON.stringify(args || {}),
			}).then(function (res) {
				return res.json().then(function (data) {
					if (!res.ok) {
						var msg = (data && data._server_messages) || (data && data.exception) || "Something went wrong";
						try {
							var parsed = JSON.parse(msg);
							msg = JSON.parse(parsed[0]).message;
						} catch (e) { /* keep raw msg */ }
						throw new Error(msg);
					}
					return data.message;
				});
			});
		}

		// ---- Lock screen ----
		els.lockForm.addEventListener("submit", function (event) {
			event.preventDefault();
			var code = els.accessCode.value.trim();
			if (!code) return;

			els.lockError.textContent = "";
			els.unlockBtn.disabled = true;
			els.unlockBtn.textContent = "Checking…";

			call("verify_access_code", { access_code: code })
				.then(function (result) {
					state.token = result.token;

					if (result.open_session) {
						els.endEmployeeName.textContent = result.employee_name;
						els.endActivityType.textContent = result.open_session.activity_type;
						els.endStartTime.textContent = formatDisplay(result.open_session.start_time);
						els.endTime.value = toLocalInputValue();
						showScreen("end");
					} else {
						els.startEmployeeName.textContent = result.employee_name;
						els.startTime.value = toLocalInputValue();
						loadActivityTypes();
						showScreen("start");
					}
				})
				.catch(function (err) {
					els.lockError.textContent = err.message || "Invalid access code";
					els.card.classList.add("shake");
					setTimeout(function () { els.card.classList.remove("shake"); }, 400);
					els.accessCode.value = "";
					els.accessCode.focus();
				})
				.finally(function () {
					els.unlockBtn.disabled = false;
					els.unlockBtn.textContent = "Unlock";
				});
		});

		function loadActivityTypes() {
			els.startActivityType.innerHTML = "<option>Loading…</option>";
			call("get_activity_types").then(function (types) {
				els.startActivityType.innerHTML = "";
				(types || []).forEach(function (t) {
					var opt = document.createElement("option");
					opt.value = t;
					opt.textContent = t;
					els.startActivityType.appendChild(opt);
				});
			}).catch(function () {
				els.startActivityType.innerHTML = "<option value=''>Failed to load</option>";
			});
		}

		// ---- Start screen ----
		els.startCancelBtn.addEventListener("click", resetToLock);

		els.startSaveBtn.addEventListener("click", function () {
			els.startError.textContent = "";
			var activityType = els.startActivityType.value;
			var startTime = els.startTime.value;

			if (!activityType) {
				els.startError.textContent = "Please select an Activity Type";
				return;
			}

			els.startSaveBtn.disabled = true;
			els.startSaveBtn.textContent = "Saving…";

			call("start_session", { token: state.token, activity_type: activityType, start_time: startTime.replace("T", " ") })
				.then(function () {
					els.doneTitle.textContent = "Timesheet started";
					els.doneMessage.textContent = "Have a productive shift!";
					showScreen("done");
					setTimeout(resetToLock, 2200);
				})
				.catch(function (err) {
					els.startError.textContent = err.message || "Could not start session";
				})
				.finally(function () {
					els.startSaveBtn.disabled = false;
					els.startSaveBtn.textContent = "Save & Start";
				});
		});

		// ---- End screen ----
		els.endCancelBtn.addEventListener("click", resetToLock);

		els.endSaveBtn.addEventListener("click", function () {
			els.endError.textContent = "";
			var endTime = els.endTime.value;

			els.endSaveBtn.disabled = true;
			els.endSaveBtn.textContent = "Saving…";

			call("end_session", { token: state.token, end_time: endTime.replace("T", " ") })
				.then(function (result) {
					els.doneTitle.textContent = "Timesheet completed";
					els.doneMessage.textContent = result.hours + " hour(s) logged for " + result.activity_type;
					showScreen("done");
					setTimeout(resetToLock, 2800);
				})
				.catch(function (err) {
					els.endError.textContent = err.message || "Could not end session";
				})
				.finally(function () {
					els.endSaveBtn.disabled = false;
					els.endSaveBtn.textContent = "Save & End";
				});
		});

		resetToLock();
	})();
	</script>
</body>
</html>
